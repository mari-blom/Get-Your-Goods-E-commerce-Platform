{% extends 'get_your_goods/base.html' %}

{% block content %}

<h2>Create Product</h2>

<form method="post">

{% csrf_token %}

<p>
<label>Store</label><br>

<select name="store">

{% for store in stores %}

<option value="{{ store.id }}">
    {{ store.name }}
</option>

{% endfor %}

</select>

</p>

<p>
<label>Product Name</label><br>

<input type="text"
       name="name"
       style="width:300px;"
       required>

</p>

<p>

<label>Description</label><br>

<textarea
name="description"
style="width:100%; height:150px;"></textarea>

</p>

<p>

<label>Price</label><br>

<input
type="number"
step="0.01"
name="price"
required>

</p>

<p>

<label>Stock</label><br>

<input
type="number"
name="stock"
required>

</p>

<button>Create Product</button>

</form>

{% endblock %}
