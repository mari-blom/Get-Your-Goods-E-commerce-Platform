{% extends 'get_your_goods/base.html' %}

{% block title %}
Vendor Dashboard
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Welcome, {{ request.user.username }}!
</h1>

<h2 class="mb-4">
    Vendor Dashboard
</h2>

<div class="row g-4">

    <div class="col-md-6 col-lg-3">
        <a href="{% url 'get_your_goods:create_store' %}"
           class="btn btn-primary w-100 py-4">
            Create Store
        </a>
    </div>

    <div class="col-md-6 col-lg-3">
        <a href="{% url 'get_your_goods:view_stores' %}"
           class="btn btn-success w-100 py-4">
            View My Stores
        </a>
    </div>

    <div class="col-md-6 col-lg-3">
        <a href="{% url 'get_your_goods:create_product' %}"
           class="btn btn-warning w-100 py-4">
            Create Product
        </a>
    </div>

    <div class="col-md-6 col-lg-3">
        <a href="{% url 'get_your_goods:view_products' %}"
           class="btn btn-info w-100 py-4">
            View My Products
        </a>
    </div>

</div>

<div class="mt-5">
    <a href="{% url 'get_your_goods:logout' %}"
       class="btn btn-outline-danger">
        Logout
    </a>
</div>

{% endblock %}
