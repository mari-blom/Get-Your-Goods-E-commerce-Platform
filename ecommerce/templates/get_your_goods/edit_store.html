{% extends 'get_your_goods/base.html' %}

{% block title %}
Edit Store
{% endblock %}

{% block content %}

<h2>Edit Store</h2>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Store Name</label><br>
        <input type="text"
               name="name"
               value="{{ store.name }}"
               style="width:300px;"
               required>
    </p>

    <p>
        <label>Description</label><br>
        <textarea name="description"
                  style="width:100%; height:150px;">{{ store.description }}</textarea>
    </p>

    <button type="submit">Save Changes</button>

</form>

{% endblock %}
