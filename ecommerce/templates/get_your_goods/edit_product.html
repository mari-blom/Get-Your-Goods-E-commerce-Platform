{% extends 'get_your_goods/base.html' %}

{% block title %}
Edit Product
{% endblock %}

{% block content %}

<h2>Edit Product</h2>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Store</label><br>

        <select name="store">
            {% for store in stores %}
                <option value="{{ store.id }}"
                    {% if store.id == product.store.id %}
                        selected
                    {% endif %}
                >
                    {{ store.name }}
                </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label>Product Name</label><br>
        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            style="width:300px;"
            required>
    </p>

    <p>
        <label>Description</label><br>
        <textarea
            name="description"
            style="width:100%; height:150px;">{{ product.description }}</textarea>
    </p>

    <p>
        <label>Price</label><br>
        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            required>
    </p>

    <p>
        <label>Stock</label><br>
        <input
            type="number"
            name="stock"
            value="{{ product.stock }}"
            required>
    </p>

    <button type="submit">Save Changes</button>

</form>

{% endblock %}
