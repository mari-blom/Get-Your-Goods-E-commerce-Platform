{% extends 'get_your_goods/base.html' %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<h2>Reset Password</h2>

<p>
    Enter your new password below.
</p>
{% if error %}
    <p style="color:red;">
        {{ error }}
    </p>
{% endif %}
<form method="post">

    {% csrf_token %}

    <p>
        <label>New Password</label><br>
        <input
            type="password"
            name="password"
            required
            style="width:300px;">
    </p>

    <p>
        <label>Confirm Password</label><br>
        <input
            type="password"
            name="confirm_password"
            required
            style="width:300px;">
    </p>

    <button type="submit">
        Reset Password
    </button>

</form>

{% endblock %}
