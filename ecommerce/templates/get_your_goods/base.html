{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %} 
            Get Your Goods 
        {% endblock title %} 
    </title>
    <link rel="stylesheet" href="{% static 'get_your_goods/style.css' %}">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
    <body>
        <header>
            <h1> 
                {% block header %} 
                    Get Your Goods 
                {% endblock header %} 
            </h1> 
            <nav>
            <a href="{% url 'get_your_goods:welcome' %}">Home</a> |
            {% if user.is_authenticated %}
            <a href="{% url 'get_your_goods:logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'get_your_goods:login' %}">Login</a>
            <a href="{% url 'get_your_goods:register' %}">Register</a>
        {% endif %}
            </nav> 
        </header>
        <main>
            {% block content %} 
            {% endblock content %}
        </main>
        

        <footer>
            <h4>GetYourGoods @ 2026</h4>
        </footer>

    </body>
</html>
